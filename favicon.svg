<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#734030"/>
      <stop offset="1" stop-color="#3A1E15"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="110" y1="180" x2="400" y2="380">
      <stop offset="0" stop-color="#FBE7AE"/>
      <stop offset="0.45" stop-color="#D6A94C"/>
      <stop offset="0.75" stop-color="#F5D98E"/>
      <stop offset="1" stop-color="#B98A34"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9ECF5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft shadow under rings -->
  <ellipse cx="256" cy="392" rx="150" ry="14" fill="#1F0F0A" opacity="0.35"/>

  <!-- left ring, right ring, then left ring segment on top to interlock -->
  <circle cx="206" cy="276" r="92" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <circle cx="306" cy="276" r="92" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <path d="M229.8 187.1 A 92 92 0 0 1 276.5 216.9" fill="none" stroke="url(#gold)" stroke-width="24"/>

  <!-- ring highlights -->
  <path d="M138 230 A 72 72 0 0 1 176 196" fill="none" stroke="#FFF6D8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M238 214 A 72 72 0 0 1 272 196" fill="none" stroke="#FFF6D8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- diamond on right ring -->
  <path d="M306 160 L326 180 L306 204 L286 180 Z" fill="url(#gem)" stroke="#BFD8E4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M286 180 L326 180 M306 160 L298 180 L306 204 L314 180 Z" fill="none" stroke="#BFD8E4" stroke-width="2" stroke-linejoin="round"/>

  <!-- pink heart -->
  <path d="M182 116 C 168 100 142 106 144 128 C 146 146 182 166 182 166 C 182 166 218 146 220 128 C 222 106 196 100 182 116 Z" fill="#E0566F"/>
  <path d="M158 120 C 160 114 166 111 172 112" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
</svg>
